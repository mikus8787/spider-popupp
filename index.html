<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spider Popup</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at center, #2a2a2a, #050505 70%);
      color: white;
      display: grid;
      place-items: center;
    }

    .center-button {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 3px solid white;
      background: #111;
      color: white;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(255,255,255,0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      z-index: 1000;
    }

    .center-button:hover {
      transform: scale(1.07);
      box-shadow: 0 0 55px rgba(255,255,255,0.55);
    }

    .popup {
      position: fixed;
      width: 150px;
      height: 230px;
      background: #111;
      border: 2px solid white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(0,0,0,0.6);
      animation: boom 0.35s ease-out both;
    }

    .popup-bar {
      height: 26px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      font-size: 12px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: white;
    }

    .popup img {
      width: 100%;
      height: calc(100% - 26px);
      object-fit: cover;
      display: block;
    }

    @keyframes boom {
      from {
        transform: scale(0) rotate(-15deg);
        opacity: 0;
      }
      to {
        transform: scale(1) rotate(var(--rot));
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <button class="center-button" id="button">KLIKNIJ</button>

  <script>
    const button = document.getElementById("button");
    const imageSrc = "./foto.jpg";

    button.addEventListener("click", () => {
      document.querySelectorAll(".popup").forEach((popup) => popup.remove());

      const screenW = window.innerWidth;
      const screenH = window.innerHeight;

      for (let i = 0; i < 50; i++) {
        const popup = document.createElement("div");
        popup.className = "popup";

        const width = 120 + Math.random() * 90;
        const height = width * 1.53;
        const left = Math.random() * Math.max(1, screenW - width);
        const top = Math.random() * Math.max(1, screenH - height);
        const rotation = Math.random() * 40 - 20;

        popup.style.width = `${width}px`;
        popup.style.height = `${height}px`;
        popup.style.left = `${left}px`;
        popup.style.top = `${top}px`;
        popup.style.zIndex = String(i + 1);
        popup.style.setProperty("--rot", `${rotation}deg`);

        popup.innerHTML = `
          <div class="popup-bar">
            <span>foto ${i + 1}</span>
            <span class="dot"></span>
          </div>
          <img src="${imageSrc}" alt="Zdjęcie" />
        `;

        document.body.appendChild(popup);
      }
    });
  </script>
</body>
</html>
