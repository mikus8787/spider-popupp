<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>50 okien</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at center, #2a2a2a, #050505 70%);
      color: white;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .wrap {
      display: grid;
      gap: 16px;
      place-items: center;
    }

    .center-button {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: 3px solid white;
      background: #111;
      color: white;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(255,255,255,0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .center-button:hover {
      transform: scale(1.07);
      box-shadow: 0 0 55px rgba(255,255,255,0.55);
    }

    .hint {
      max-width: 520px;
      opacity: 0.8;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <button class="center-button" id="button">KLIKNIJ</button>
    <div class="hint">Po kliknięciu strona spróbuje otworzyć 50 osobnych okien ze zdjęciem.</div>
  </div>

  <script>
    const button = document.getElementById("button");
    const imageSrc = "foto.jpg";

    button.addEventListener("click", () => {
      for (let i = 0; i < 50; i++) {
        const width = 260;
        const height = 420;
        const left = Math.floor(Math.random() * Math.max(1, screen.availWidth - width));
        const top = Math.floor(Math.random() * Math.max(1, screen.availHeight - height));

        const win = window.open(
          "",
          `_foto_${Date.now()}_${i}`,
          `popup=yes,width=${width},height=${height},left=${left},top=${top}`
        );

        if (!win) {
          alert("Przeglądarka zablokowała wyskakujące okna. Zezwól na pop-upy dla tej strony i kliknij jeszcze raz.");
          break;
        }

        win.document.open();
        win.document.write(`
          <!doctype html>
          <html lang="pl">
          <head>
            <meta charset="UTF-8">
            <title>Foto ${i + 1}</title>
            <style>
              html, body {
                margin: 0;
                width: 100%;
                height: 100%;
                background: #000;
                overflow: hidden;
              }
              img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
              }
            </style>
          </head>
          <body>
            <img src="${location.href.replace(/index\.html$/, "")}${imageSrc}" alt="foto">
          </body>
          </html>
        `);
        win.document.close();
      }
    });
  </script>
</body>
</html>
